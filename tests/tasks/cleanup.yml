---
- name: Restore sudoers
  copy:
    src: "{{ __sudo_tmpdir.path }}/sudoers"
    dest: /etc/sudoers
    owner: root
    group: root
    mode: "0644"
    remote_src: true
  when: __sudo_sudoers_stat.stat.exists

- name: Remove sudoers created by the test
  file:
    path: /etc/sudoers
    state: absent
  when: not __sudo_sudoers_stat.stat.exists

- name: Restore sudoers.d
  copy:
    src: "{{ __sudo_tmpdir.path }}/sudoers.d"
    dest: /etc/sudoers.d
    owner: root
    group: root
    mode: "0644"
    remote_src: true

- name: Clean up temp directory
  file:
    path: "{{ __sudo_tmpdir.path }}"
    state: absent
