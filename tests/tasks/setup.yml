---
- name: Create temp test directory
  tempfile:
    path: /var/tmp
    prefix: sudo_
    state: directory
  register: __sudo_tmpdir

# Some distributions ship only /usr/etc/sudoers until /etc/sudoers is created
- name: Check for /etc/sudoers
  stat:
    path: /etc/sudoers
  register: __sudo_sudoers_stat

- name: Backup sudoers
  copy:
    src: /etc/sudoers
    dest: "{{ __sudo_tmpdir.path }}/sudoers"
    owner: root
    group: root
    mode: "0644"
    remote_src: true
  when: __sudo_sudoers_stat.stat.exists

- name: Backup sudoers.d
  copy:
    src: /etc/sudoers.d
    dest: "{{ __sudo_tmpdir.path }}/sudoers.d"
    owner: root
    group: root
    mode: "0644"
    remote_src: true
